      PIPELINE_VERSION: ${PIPELINE_VERSION:-v3}
      PIPELINE_ALLOWED: ${PIPELINE_ALLOWED:-v1,v2,v3}
      TTS_PROVIDER: ${TTS_PROVIDER:-stub}
