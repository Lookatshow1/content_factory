      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io/v1}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_multilingual_v2}
      ELEVENLABS_STABILITY: ${ELEVENLABS_STABILITY:-0.5}
      ELEVENLABS_SIMILARITY: ${ELEVENLABS_SIMILARITY:-0.75}
      VIDEO_BACKEND: ${VIDEO_BACKEND:-ffmpeg}
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      HEYGEN_BASE_URL: ${HEYGEN_BASE_URL:-https://api.heygen.com}
