version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-svf}
      TZ: ${TZ:-Europe/Amsterdam}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: ${TZ:-Europe/Amsterdam}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      RUN_TIMES: ${RUN_TIMES:-09:30,13:30,18:30}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      LLM_PROVIDER_PRIMARY: ${LLM_PROVIDER_PRIMARY:-yandex}
      LLM_PROVIDER_FALLBACK: ${LLM_PROVIDER_FALLBACK:-openrouter}
      LLM_MODEL_RESEARCHER: ${LLM_MODEL_RESEARCHER:-}
      LLM_MODEL_WRITER: ${LLM_MODEL_WRITER:-}
      LLM_MODEL_EDITOR: ${LLM_MODEL_EDITOR:-}
      LLM_MODEL_JUDGE: ${LLM_MODEL_JUDGE:-}
      LLM_MODEL_FALLBACK: ${LLM_MODEL_FALLBACK:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1200}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.6}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      YANDEX_BASE_URL: ${YANDEX_BASE_URL:-https://llm.api.cloud.yandex.net/v1}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_MODEL: ${YANDEX_MODEL:-gpt://__FOLDER__/yandexgpt/latest}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_X_TITLE: ${OPENROUTER_X_TITLE:-}
      GOOGLE_BASE_URL: ${GOOGLE_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-1.5-pro-latest}
      REPEAT_SIMILARITY_THRESHOLD: ${REPEAT_SIMILARITY_THRESHOLD:-0.55}
      SERIES_MODE: ${SERIES_MODE:-round_robin}
      FACT_MODE: ${FACT_MODE:-bank_only}
      FORCE_RUBRIC_ID: ${FORCE_RUBRIC_ID:-}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-v3}
      PIPELINE_ALLOWED: ${PIPELINE_ALLOWED:-v1,v2,v3}
      TTS_PROVIDER: ${TTS_PROVIDER:-stub}
      TTS_TIMEOUT: ${TTS_TIMEOUT:-60}
      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io/v1}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_multilingual_v2}
      ELEVENLABS_STABILITY: ${ELEVENLABS_STABILITY:-0.5}
      ELEVENLABS_SIMILARITY: ${ELEVENLABS_SIMILARITY:-0.75}
      VIDEO_BACKEND: ${VIDEO_BACKEND:-ffmpeg}
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      HEYGEN_BASE_URL: ${HEYGEN_BASE_URL:-https://api.heygen.com}
      HEYGEN_POLL_INTERVAL: ${HEYGEN_POLL_INTERVAL:-20}
      HEYGEN_MAX_POLLS: ${HEYGEN_MAX_POLLS:-10}
      PUBLISH_VK_ENABLED: ${PUBLISH_VK_ENABLED:-false}
      PUBLISH_TIKTOK_ENABLED: ${PUBLISH_TIKTOK_ENABLED:-false}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-}
      VK_API_VERSION: ${VK_API_VERSION:-5.131}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
    ports:
      - "${API_PORT:-8000}:8000"

